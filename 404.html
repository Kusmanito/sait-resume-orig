<body>
  <app-root></app-root>

  <script src="polyfills-5CFQRCPP.js" type="module"></script>
  <script src="main-U42UFBNC.js" type="module"></script>

  <script>
    window.addEventListener('load', function () {
      const repoUrl = 'https://github.com/Kusmanito/resume';

      function addMonorepoButton() {
        const heroActions = document.querySelector('.hero-actions');

        if (!heroActions) {
          return false;
        }

        if (document.querySelector('.monorepo-btn')) {
          return true;
        }

        const button = document.createElement('a');

        button.className = 'btn btn-secondary monorepo-btn';
        button.href = repoUrl;
        button.target = '_blank';
        button.rel = 'noopener noreferrer';

        button.innerHTML = `
          <span>Монорепозиторий</span>
          <span class="btn-icon">↗</span>
        `;

        heroActions.appendChild(button);

        return true;
      }

      if (addMonorepoButton()) {
        return;
      }

      const observer = new MutationObserver(function () {
        if (addMonorepoButton()) {
          observer.disconnect();
        }
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      setTimeout(function () {
        observer.disconnect();
      }, 10000);
    });
  </script>
<script src="polyfills-5CFQRCPP.js" type="module"></script><script src="main-XT6ZKEUV.js" type="module"></script></body>
